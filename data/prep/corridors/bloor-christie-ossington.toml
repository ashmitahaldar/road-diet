# Inputs for `python prep.py corridor corridors/bloor-christie-ossington.toml`.
# Values marked `estimate = true` are not in a verified dataset; they are listed in the corridor JSON
# under "estimates" and shown on the limitations panel and /data (spec 4.5).

id = "bloor-christie-ossington"
name = "Bloor St W (Christie St to Ossington Ave)"
retrieved = "2026-10-17"

[segment]
street = "Bloor St W"
# Toronto Centreline v2 segments named "Bloor St W" on the path from the Christie St intersection
# (13464635) to the Ossington Ave intersection (13464908).
centreline_ids = [1143319, 1143498, 1143545, 1143576, 10877626, 30039478, 30039479, 30039482, 60088092]

[width]
metres = 20
source = "Official Plan Map 3 (June 2026): Bloor St W from Ossington Ave to Bathurst St is drawn in the 20 m colour. Planned right-of-way, read from the PDF."

[count]
# tmc_most_recent_summary_data: Bloor St W / Shaw St, 2025-06-25, 14 h. Mid-segment, little cross traffic.
latest_count_id = 113002
peak = "pm"

[demand]
# Persons per vehicle. Not yet sourced (#13 replaces it); 1.0 counts each vehicle as one person.
car_occupancy = 1.0
# Subway Line 2 runs under Bloor St W; no daytime surface bus route on this segment, so no bus demand on the street.
bus_persons_per_hour = 0
bus_note = "Subway Line 2 runs below; no daytime surface bus on this segment."

[safety]
buffer_m = 30
years = 5

[speed]
kph = 40
estimate = true
note = "Posted speed is not in a verified dataset; 40 km/h is assumed. Confirm."

[layout]
estimate = true
note = "No open dataset gives lane widths. Cycle tracks come from cycling-network (Cycle Track, installed 2016/2020); the rest is an estimate of today's street within 20 m. Confirm."
elements = [
  { id = "sidewalk", widthM = 3.7 },
  { id = "bike_protected", widthM = 1.8 },
  { id = "parking", widthM = 2.4 },
  { id = "car_lane", widthM = 3.3 },
  { id = "car_lane", widthM = 3.3 },
  { id = "bike_protected", widthM = 1.8 },
  { id = "sidewalk", widthM = 3.7 },
]
